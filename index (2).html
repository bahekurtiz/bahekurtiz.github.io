<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BAHE Order Desk</title><style>body{font:14px system-ui;margin:0;background:#f6f4ef;color:#173b39}main{max-width:1200px;margin:auto;padding:20px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select,button,textarea{font:inherit;padding:9px;border:1px solid #bbb;border-radius:8px}button{cursor:pointer}.card{background:white;margin:12px 0;padding:14px;border-radius:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#667}b{font-weight:650}</style></head><body><main><header><h1>BAHE Order Desk</h1><input id="token" type="password" placeholder="Admin token"><button id="load">Load orders</button></header><p class="muted">Statuses: New → Confirmed → Processing → Packed → Shipped → Delivered. Cancelled / Refunded / Returned are also supported.</p><div id="orders"></div></main><script>const E=document.querySelector('#orders'),T=document.querySelector('#token');T.value=sessionStorage.baheAdmin||'';async function api(opt={}){sessionStorage.baheAdmin=T.value;let r=await fetch('/api/admin/orders',{...opt,headers:{'content-type':'application/json','authorization':'Bearer '+T.value,...opt.headers}}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){E.textContent='Loading…';try{let j=await api();E.innerHTML=j.orders.map(o=>`<div class="card" data-ref="${esc(o.ref)}"><div><b>${esc(o.ref)}</b> · ${esc(o.name)} · ${esc(o.currency)} ${esc(o.total)} · Payment: <b>${esc(o.payment_status)}</b></div><div class="muted">${esc(o.items)}<br>${esc([o.address,o.city,o.state,o.pincode,o.country].filter(Boolean).join(', '))} · ${esc(o.phone)} ${esc(o.email)}</div><div class="row"><select class="status">${['New','Confirmed','Processing','Packed','Shipped','Delivered','Cancelled','Refunded','Returned'].map(x=>`<option${x===o.status?' selected':''}>${x}</option>`).join('')}</select><input class="carrier" placeholder="Carrier" value="${esc(o.carrier)}"><input class="tracking" placeholder="Tracking" value="${esc(o.tracking)}"><input class="note" placeholder="Internal note" value="${esc(o.note)}"><button class="save">Save</button></div></div>`).join('')||'<p>No orders yet.</p>';document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{let c=b.closest('.card');b.disabled=true;try{await api({method:'PATCH',body:JSON.stringify({ref:c.dataset.ref,status:c.querySelector('.status').value,carrier:c.querySelector('.carrier').value,tracking:c.querySelector('.tracking').value,note:c.querySelector('.note').value})});b.textContent='Saved ✓'}catch(e){alert(e.message)}finally{b.disabled=false}})}catch(e){E.textContent=e.message}}document.querySelector('#load').onclick=load;</script></body></html>
