# Bahe Kurtiz admin panel (Sveltia CMS).
# __REPO__ / __BRANCH__ are filled in automatically when the site is built on GitHub.
backend:
  name: github
  repo: __REPO__
  branch: __BRANCH__
  commit_messages:
    create: "नया प्रोडक्ट: {{slug}}"
    update: "अपडेट: {{slug}}"
    delete: "हटाया: {{slug}}"

site_url: __SITE_URL__
display_url: __SITE_URL__

slug:
  encoding: ascii
  clean_accents: true

media_folder: static/images/products
public_folder: /images/products

# Big phone/camera photos are shrunk and converted to WebP before upload (fast site, small repo)
media_libraries:
  default:
    config:
      max_file_size: 25000000
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1400
          height: 1400

collections:
  - name: products
    label: "प्रोडक्ट (Products)"
    label_singular: "प्रोडक्ट"
    folder: content/products
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{title}} · {{category}} · ₹{{price}} · ${{price_usd}}"
    sortable_fields: [sort_order, title, price]
    preview_path: "products/{{slug}}/"
    fields:
      - { name: title, label: "नाम (Product name)", widget: string, hint: "अंग्रेज़ी में लिखो, जैसे: Rani Pink Embroidered Kurti. नाम में रंग + कपड़ा + स्टाइल लिखो, Google पर इसी से मिलेगा" }
      - name: category
        label: "कैटेगरी (Category)"
        widget: select
        options:
          - Kurti
          - Kurti Set
          - Kurta Pant Dupatta Set
          - Anarkali Kurti
          - A-Line Kurti
          - Straight Kurti
          - Short Kurti
          - Long Kurti
          - Angrakha Kurti
          - Dress
          - Maxi Dress
          - Midi Dress
          - Short Dress
          - Anarkali Dress
          - Gown
          - Kaftan
          - Co-ord Set
          - Top
          - Tunic
          - Palazzo / Pants
          - Dupatta
          - Stole
          - Accessories
        default: Kurti
      - { name: color, label: "रंग (Colour)", widget: string, required: false }
      - { name: price, label: "दाम ₹ (Selling price)", widget: number, value_type: int, required: false, hint: "खाली छोड़ोगे तो 'Price on WhatsApp' दिखेगा" }
      - { name: mrp, label: "MRP ₹ (कटा हुआ दाम, optional)", widget: number, value_type: int, required: false }
      - { name: price_usd, label: "विदेश का दाम $ (USD)", widget: number, value_type: float, required: false, hint: "विदेशी ग्राहक को यही दाम दिखेगा। खाली छोड़ोगे तो सेटिंग्स वाले 'डॉलर रेट' से अपने-आप बनेगा (रेट न हो तो 'Price on request')" }
      - { name: mrp_usd, label: "विदेश MRP $ (कटा हुआ दाम, optional)", widget: number, value_type: float, required: false }
      - { name: ships_abroad, label: "विदेश भेज सकते हैं? (Ships internationally)", widget: boolean, default: true }
      - name: sizes
        label: "साइज़ (Sizes)"
        widget: select
        multiple: true
        options: [XS, S, M, L, XL, XXL, 3XL, 4XL, 5XL, Free Size]
        default: [S, M, L, XL, XXL]
        required: false
      - { name: sold_out_sizes, label: "कौन से साइज़ खत्म हैं? (Sold out – 'Notify me' दिखेगा)", widget: select, multiple: true, options: [XS, S, M, L, XL, XXL, 3XL, 4XL, 5XL, Free Size], required: false }
      - { name: occasion, label: "मौका (Occasion)", widget: select, multiple: true, required: false, options: [Office, Daily, Festive, Wedding, Haldi & Mehendi, Party, Vacation, Gifting] }
      - { name: model_height, label: "मॉडल की लंबाई (जैसे 5'5\")", widget: string, required: false }
      - { name: model_size, label: "मॉडल ने कौन सा साइज़ पहना है", widget: string, required: false }
      - { name: fit, label: "फ़िट", widget: select, options: [Relaxed, Regular, Fitted], required: false }
      - name: fabric
        label: "कपड़ा (Fabric)"
        widget: select
        required: false
        options:
          - Cotton
          - Pure Cotton
          - Cambric Cotton
          - Mul Cotton (Mulmul)
          - Cotton Slub
          - Cotton Flex
          - Cotton Blend
          - Cotton Silk
          - Cotton Linen
          - Linen
          - Khadi
          - Rayon
          - Rayon Slub
          - Viscose
          - Modal
          - Muslin
          - Chanderi
          - Chanderi Silk
          - Maheshwari
          - Art Silk
          - Silk Blend
          - Tussar Silk
          - Kota Doria
          - Georgette
          - Faux Georgette
          - Chiffon
          - Crepe
          - Satin
          - Organza
          - Net
          - Velvet
          - Voile
          - Poplin
          - Modal Silk
          - Banarasi
          - Jacquard
          - Dola Silk
          - Russian Silk
          - Roman Silk
          - Tissue
          - Hakoba / Schiffli
          - Denim
          - Wool
          - Bamboo
          - Tencel
          - Polyester
          - Lycra
          - Other
        hint: "लिस्ट में न मिले तो 'Other' चुनो और कपड़े का नाम जानकारी (Description) में लिखो"
      - name: print_work
        label: "प्रिंट / काम (Print or work)"
        widget: select
        multiple: true
        required: false
        options:
          - All Over Print
          - Hand Block Print
          - Sanganeri Print
          - Bagru Print
          - Dabu Print
          - Ajrakh Print
          - Indigo Print
          - Screen Print
          - Digital Print
          - Floral Print
          - Bandhani
          - Leheriya
          - Kalamkari
          - Foil Print
          - Gota Patti
          - Embroidered
          - Chikankari
          - Mirror Work
          - Sequin Work
          - Bagh Print
          - Jaipuri Print
          - Mughal Print
          - Indigo Dabu
          - Shibori / Tie-Dye
          - Batik
          - Ikat
          - Madhubani Print
          - Pichwai Print
          - Hand Painted
          - Thread Work
          - Zari Work
          - Kantha
          - Phulkari
          - Kutch Work
          - Pintuck
          - Lace Work
          - Solid / Plain
      - { name: description, label: "जानकारी (Description)", widget: text, required: false, hint: "2-3 लाइन। खाली लाइन = नया पैराग्राफ़" }
      - name: images
        label: "फ़ोटो (Photos) – पहली फ़ोटो मुख्य होगी"
        widget: list
        field: { name: image, label: "फ़ोटो", widget: image }
      - { name: video, label: "छोटी रील / वीडियो (optional, mp4)", widget: file, required: false, media_folder: /static/media/products, public_folder: /media/products, hint: "10-15 सेकंड, 8 MB से कम। फ़ोटो के साथ अपने-आप चलती रहेगी (बिना आवाज़)।" }
      - { name: match_products, label: "Shop the Look – साथ में मैच होने वाले प्रोडक्ट (optional)", widget: relation, collection: products, value_field: "{{slug}}", search_fields: [title], display_fields: [title], multiple: true, required: false, hint: "जैसे कुर्ती के साथ पलाज़ो / दुपट्टा। प्रोडक्ट पेज पर 'Complete the look' में दिखेंगे" }
      - { name: tryon_png, label: "Mirror के लिए कटआउट फ़ोटो (पारदर्शी PNG, सिर्फ़ कपड़ा) – optional", widget: image, required: false, hint: "बैकग्राउंड हटाकर सिर्फ़ ड्रेस वाली PNG डालोगे तो Mirror में ड्रेस ग्राहक की फ़ोटो पर ज़्यादा असली लगेगी" }
      - { name: sku, label: "SKU / Product ID (optional)", widget: string, required: false }
      - { name: set_items, label: "सेट में क्या-क्या है? (जैसे: Kurta, Pant, Dupatta) – optional", widget: list, required: false, field: { name: item, label: "चीज़", widget: string } }
      - { name: care, label: "धुलाई / देखभाल (optional)", widget: string, required: false, hint: "खाली छोड़ो तो कपड़े के हिसाब से अपने-आप दिखेगा" }
      - { name: processing_days, label: "बनने / पैक होने में दिन (optional, जैसे 2-4)", widget: string, required: false }
      - { name: return_override, label: "इस प्रोडक्ट का return नियम (optional)", widget: select, required: false, options: ["Default", "Exchange only", "Non-returnable", "Custom size – no return"], default: "Default" }
      - { name: garment_length, label: "कुर्ती / ड्रेस की लंबाई (inch, optional)", widget: number, value_type: float, required: false }
      - { name: sale_paused, label: "⛔ बिक्री रोको (product दिखेगा, पर ऑर्डर नहीं होगा)", widget: boolean, default: false, required: false }
      - { name: in_stock, label: "स्टॉक में है? (In stock)", widget: boolean, default: true, hint: "बंद करोगे तो 'Made to order' दिखेगा" }
      - { name: featured, label: "होमपेज पर दिखाओ (Show on homepage)", widget: boolean, default: true }
      - { name: bestseller, label: "⭐ Bestseller (होमपेज के Bestsellers में + बैज)", widget: boolean, default: false }
      - { name: sort_order, label: "क्रम (Order – छोटा नंबर पहले)", widget: number, value_type: int, default: 50 }
      - { name: seo_title, label: "SEO टाइटल (optional)", widget: string, required: false, hint: "खाली छोड़ दो तो नाम से अपने-आप बनेगा" }
      - { name: seo_description, label: "SEO डिस्क्रिप्शन (optional, 150 अक्षर)", widget: string, required: false }

  - name: blog
    label: "ब्लॉग (Blog)"
    label_singular: "ब्लॉग पोस्ट"
    folder: content/blog
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    preview_path: "blog/{{slug}}/"
    fields:
      - { name: title, label: "टाइटल", widget: string, hint: "अंग्रेज़ी/Hinglish में लिखो (इसी से लिंक बनेगा), जैसे: 5 Best Cotton Kurtis for Office" }
      - { name: date, label: "तारीख़", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", default: "{{now}}" }
      - { name: cover, label: "कवर फ़ोटो", widget: image, required: false }
      - { name: excerpt, label: "छोटा सार (1-2 लाइन)", widget: text, required: false }
      - { name: tags, label: "टैग", widget: list, required: false }
      - { name: body, label: "पूरा लेख", widget: markdown, hint: "## से सेक्शन हेडिंग बनाओ। फ़ोटो और लिंक टूलबार से डालो" }
      - name: related_products
        label: "इस पोस्ट में कौन-से प्रोडक्ट दिखाने हैं"
        widget: relation
        collection: products
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - { name: draft, label: "ड्राफ़्ट (अभी छुपाओ)", widget: boolean, default: false }
      - { name: seo_title, label: "SEO टाइटल (optional)", widget: string, required: false }
      - { name: seo_description, label: "SEO डिस्क्रिप्शन (optional, 150 अक्षर)", widget: string, required: false }

  - name: banners
    label: "बैनर (Banners) – होमपेज स्लाइडर"
    label_singular: "बैनर"
    folder: content/banners
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{order}} · {{title}} · {{start}} → {{end}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: "बड़ी हेडिंग (जैसे: Diwali Sale – Flat 20% Off)", widget: string }
      - { name: image, label: "मोबाइल बैनर (खड़ा, 1080×1350 या 1200×1800)", widget: image, media_folder: /static/images/banners, public_folder: /images/banners }
      - { name: image_desktop, label: "कंप्यूटर बैनर (चौड़ा, 1920×760)", widget: image, required: false, media_folder: /static/images/banners, public_folder: /images/banners }
      - { name: eyebrow, label: "ऊपर की छोटी लाइन (जैसे: Festive Edit)", widget: string, required: false }
      - { name: subtitle, label: "छोटी लाइन", widget: string, required: false }
      - { name: button, label: "बटन का नाम (जैसे: Shop Sale)", widget: string, required: false }
      - { name: link, label: "बटन का लिंक (जैसे: occasion/festive/ या shop/)", widget: string, required: false }
      - { name: start, label: "कब से दिखाना है (खाली = अभी से)", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { name: end, label: "कब तक (खाली = हमेशा) – तारीख के बाद अपने-आप हट जाएगा", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { name: order, label: "क्रम (1 = सबसे पहले)", widget: number, value_type: int, default: 10 }
      - { name: active, label: "चालू है?", widget: boolean, default: true }

  - name: stories
    label: "Stories (Instagram जैसी) – होमपेज के ऊपर"
    label_singular: "Story"
    folder: content/stories
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{order}} · {{title}}"
    description: "कोई Story नहीं डालोगे तो प्रोडक्ट्स से अपने-आप बन जाएँगी (New, Bestsellers, Festive…)"
    fields:
      - { name: title, label: "नाम (छोटा, जैसे: New, Diwali, Factory)", widget: string }
      - { name: cover, label: "गोल फ़ोटो (optional)", widget: image, required: false, media_folder: /static/images/stories, public_folder: /images/stories }
      - name: slides
        label: "Story की स्लाइड (फ़ोटो या 15 सेकंड वीडियो)"
        widget: list
        fields:
          - { name: image, label: "फ़ोटो (खड़ी 1080×1920)", widget: image, required: false, media_folder: /static/images/stories, public_folder: /images/stories }
          - { name: video, label: "या वीडियो (mp4, 8MB से कम)", widget: file, required: false, media_folder: /static/media/stories, public_folder: /media/stories }
          - { name: caption, label: "लाइन", widget: string, required: false }
          - { name: product, label: "Shop स्टिकर – कौन सा प्रोडक्ट", widget: relation, collection: products, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
          - { name: link, label: "या कोई और लिंक", widget: string, required: false }
      - { name: order, label: "क्रम", widget: number, value_type: int, default: 10 }
      - { name: end, label: "कब तक दिखानी है (खाली = हमेशा)", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { name: active, label: "चालू है?", widget: boolean, default: true }

  - name: landing
    label: "SEO पेज (Google पर आने के लिए)"
    label_singular: "SEO पेज"
    folder: content/landing
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: h1
    summary: "/{{slug}}/ – {{h1}}"
    fields:
      - { name: slug, label: "लिंक (अंग्रेज़ी, - से जोड़ो)", widget: string, hint: "जैसे: block-print-kurti-manufacturer-jaipur" }
      - { name: h1, label: "बड़ी हेडिंग (जो लोग Google पर लिखते हैं)", widget: string }
      - { name: eyebrow, label: "ऊपर की छोटी लाइन", widget: string, required: false }
      - { name: lead, label: "पहली 1-2 लाइन", widget: text, required: false }
      - { name: match, label: "कौन से प्रोडक्ट दिखें (शब्द, comma से)", widget: string, required: false, hint: "जैसे: block print, cotton, kurti" }
      - { name: products_title, label: "प्रोडक्ट सेक्शन की हेडिंग", widget: string, required: false }
      - { name: body, label: "पूरा लेख", widget: markdown }
      - name: faq
        label: "सवाल-जवाब (FAQ – Google में दिखते हैं)"
        widget: list
        required: false
        summary: "{{fields.q}}"
        fields:
          - { name: q, label: "सवाल", widget: string }
          - { name: a, label: "जवाब", widget: text }
      - { name: seo_title, label: "SEO टाइटल (60 अक्षर)", widget: string, required: false }
      - { name: seo_description, label: "SEO डिस्क्रिप्शन (155 अक्षर)", widget: string, required: false }
      - { name: draft, label: "ड्राफ़्ट (अभी छुपाओ)", widget: boolean, default: false }

  - name: settings
    label: "सेटिंग्स (Settings)"
    files:
      - name: site
        label: "वेबसाइट सेटिंग्स"
        file: content/settings.json
        format: json
        fields:
          - { name: brand_name, label: "ब्रांड का नाम", widget: string }
          - { name: logo, label: "लोगो (Logo – PNG, पारदर्शी)", widget: image, required: false }
          - { name: favicon, label: "छोटा आइकन (Favicon – 512×512 PNG)", widget: image, required: false }
          - { name: tagline, label: "टैगलाइन", widget: string }
          - { name: announcement, label: "ऊपर चलने वाली पट्टी (हर मैसेज के बीच | लगाओ)", widget: string, required: false }
          - { name: emergency_note, label: "🚨 इमरजेंसी मैसेज (हर पेज पर सबसे ऊपर लाल पट्टी) – खाली = बंद", widget: string, required: false }
          - { name: languages_off, label: "🌐 भाषा बटन (8 भाषाएँ) बंद करो?", widget: boolean, default: false, required: false }
          - { name: local_currency_display, label: "विदेशी ग्राहक को अपनी currency में अंदाज़न price (≈ £, ≈ ¥) दिखाओ? (charge हमेशा $ में)", widget: boolean, default: true, required: false }
          - { name: maintenance_mode, label: "🛠️ Maintenance mode (वेबसाइट दिखेगी, पर ऑर्डर बंद)", widget: boolean, default: false, required: false }
          - { name: checkout_pause, label: "⏸️ Checkout pause (नए ऑर्डर अस्थायी बंद)", widget: boolean, default: false, required: false }
          - { name: pause_message, label: "ऑर्डर बंद होने पर ग्राहक को मैसेज", widget: string, required: false, default: "We are updating our store. Orders will open again shortly – WhatsApp us for help." }
          - { name: india_handling_days, label: "🇮🇳 India: पैक होने में दिन (जैसे 1-3)", widget: string, required: false, default: "1-3" }
          - { name: india_transit_days, label: "🇮🇳 India: कूरियर में दिन (जैसे 3-7)", widget: string, required: false, default: "3-7" }
          - { name: india_return_rule, label: "🇮🇳 India: Return / exchange नियम (ग्राहक को दिखेगा)", widget: string, required: false }
          - name: markets
            label: "🌍 देश-वार नियम (Market Control) – हर देश के लिए एक"
            widget: list
            required: false
            summary: "{{fields.country}} – {{fields.status}}"
            hint: "सिर्फ़ वही भरो जो सच में चलता है। कोई चीज़ खाली छोड़ी तो वेबसाइट उसका वादा नहीं करेगी।"
            fields:
              - { name: country, label: "देश कोड (US, GB, CA, AU, AE, DE…)", widget: string }
              - { name: status, label: "स्थिति", widget: select, options: ["Live", "Paused", "Not launched"], default: "Live" }
              - { name: handling_days, label: "पैक होने में दिन (जैसे 2-4)", widget: string, required: false }
              - { name: transit_days, label: "कूरियर में दिन (जैसे 7-12)", widget: string, required: false }
              - { name: courier, label: "कूरियर (DHL / FedEx / India Post…)", widget: string, required: false }
              - { name: return_rule, label: "Return / exchange नियम", widget: string, required: false }
              - { name: duty_note, label: "Duty / tax जानकारी (सच में जो लागू हो)", widget: string, required: false }
