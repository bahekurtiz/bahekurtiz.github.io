name: Daily IndexNow (Bing, Copilot, ChatGPT search)
on:
  schedule:
    - cron: "40 3 * * *"   # 09:10 IST, after the daily publish tick has deployed
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/indexnow-daily.mjs
